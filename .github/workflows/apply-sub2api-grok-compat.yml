name: Apply Sub2API Grok Compat

on:
  push:
    branches:
      - sub2api-grok-compat
  pull_request:
    branches:
      - main
    paths:
      - 'crates/**'
      - 'src-tauri/**'
      - 'frontend/**'
      - 'scripts/apply_sub2api_grok_compat.py'
      - 'scripts/apply_sub2api_grok_compat_ui.py'
      - '.github/workflows/apply-sub2api-grok-compat.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[compat-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'sub2api-grok-compat' }}
          fetch-depth: 0

      - name: Apply Responses compat patch
        run: python3 scripts/apply_sub2api_grok_compat.py

      - name: Apply UI/provider compat patch
        run: python3 scripts/apply_sub2api_grok_compat_ui.py

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Format Rust
        run: cargo fmt --all

      - name: Build frontend (TypeScript + Vite)
        run: npm --prefix frontend run build

      - name: Test adapters
        run: cargo test -p codex-app-transfer-adapters sub2api_grok_compat -- --nocapture

      - name: Show generated diff
        if: always()
        shell: bash
        run: |
          git status --short
          git diff -- \
            crates/adapters/src/mapper/responses.rs \
            src-tauri/src/admin/handlers/providers/crud.rs \
            src-tauri/tauri.conf.json \
            frontend/src/api/types.ts \
            frontend/src/api/providers.ts \
            frontend/src/components/provider/ProviderFormModal.vue \
            frontend/src/layout/TopTabBar.vue \
            frontend/src/layout/AppLayout.vue \
            frontend/src/i18n/zh.ts \
            frontend/src/i18n/en.ts || true

      - name: Commit generated source changes
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            crates/adapters/src/mapper/responses.rs \
            src-tauri/src/admin/handlers/providers/crud.rs \
            src-tauri/tauri.conf.json \
            frontend/src/api/types.ts \
            frontend/src/api/providers.ts \
            frontend/src/components/provider/ProviderFormModal.vue \
            frontend/src/layout/TopTabBar.vue \
            frontend/src/layout/AppLayout.vue \
            frontend/src/i18n/zh.ts \
            frontend/src/i18n/en.ts
          git commit -m "feat: add visible Sub2API Grok compat controls [compat-generated]"
          git push origin HEAD:sub2api-grok-compat
