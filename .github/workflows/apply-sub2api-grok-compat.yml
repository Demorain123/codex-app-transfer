name: Apply Sub2API Grok Compat

on:
  push:
    branches:
      - sub2api-grok-compat

permissions:
  contents: write

jobs:
  patch-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sub2api-grok-compat
          fetch-depth: 0

      - name: Apply patch
        run: python3 scripts/apply_sub2api_grok_compat.py

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format
        run: cargo fmt --all

      - name: Test adapters
        run: cargo test -p codex-app-transfer-adapters sub2api_grok_compat -- --nocapture

      - name: Commit generated source change
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/adapters/src/mapper/responses.rs
          git commit -m "feat: add Sub2API Grok Responses compatibility [skip ci]"
          git push origin HEAD:sub2api-grok-compat
