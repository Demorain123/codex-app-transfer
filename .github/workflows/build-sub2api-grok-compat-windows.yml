name: Build Sub2API Grok Compat Windows

on:
  workflow_dispatch:
  push:
    branches:
      - sub2api-grok-compat
      - 'sub2api-grok-compat-next-*'
    paths:
      - 'crates/**'
      - 'src-tauri/**'
      - 'frontend/**'
      - 'scripts/**'
      - 'SUB2API_GROK_COMPAT_REVISION.txt'
      - 'SUB2API_GROK_COMPAT_VERSION.txt'
      - '.github/workflows/build-sub2api-grok-compat-windows.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    branches:
      - main
      - sub2api-grok-compat
      - 'sub2api-grok-compat-next-*'
    paths:
      - 'crates/**'
      - 'src-tauri/**'
      - 'frontend/**'
      - 'scripts/**'
      - 'SUB2API_GROK_COMPAT_REVISION.txt'
      - 'SUB2API_GROK_COMPAT_VERSION.txt'
      - '.github/workflows/build-sub2api-grok-compat-windows.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve and apply highest compat composer
        id: composer
        shell: bash
        run: |
          set -euo pipefail

          # CAS-DYNAMIC-COMPAT-COMPOSER: select the numerically highest replayable
          # unified composer instead of checking for r28 first. All future revisions
          # should keep the apply_rNN_unified.py convention; r28 is retained as a
          # compatibility candidate because its historical composer has a special name.
          COMPOSER="$(python - <<'PY'
          from pathlib import Path
          import re

          candidates: list[tuple[int, Path]] = []
          for path in Path('scripts').glob('apply_r*_unified.py'):
              match = re.fullmatch(r'apply_r(\d+)_unified\.py', path.name)
              if match:
                  candidates.append((int(match.group(1)), path))

          r28 = Path('scripts/apply_r28_hybrid_direct.py')
          if r28.is_file():
              candidates.append((28, r28))

          if candidates:
              revision, path = max(candidates, key=lambda item: item[0])
              print(path.as_posix())
          PY
          )"

          if [[ -n "$COMPOSER" ]]; then
            echo "Using highest compat composer: $COMPOSER"
            python "$COMPOSER"
          else
            echo 'Using legacy compat composer chain'
            python scripts/apply_sub2api_grok_compat.py
            python scripts/apply_sub2api_grok_compat_ui_dispatch.py
            python scripts/apply_sub2api_grok_gateway_auth.py
            python scripts/apply_sub2api_grok_replay_compat.py
            python scripts/apply_sub2api_grok_apply_patch_r14_bootstrap.py
            python scripts/apply_sub2api_grok_terminal_compat.py
            python scripts/apply_sub2api_grok_apply_patch_recovery.py
            python scripts/apply_sub2api_grok_apply_patch_hardening.py
            python scripts/apply_sub2api_grok_apply_patch_r17_review.py
            python scripts/apply_sub2api_grok_apply_patch_r17_review2.py
            python scripts/apply_sub2api_openai_codex_identity.py
            python scripts/apply_sub2api_subagent_retry_diag.py
            python scripts/apply_sub2api_stream_retry_diag.py
            python scripts/apply_sub2api_mcp_relay_diag.py
            python scripts/apply_no_micro_r23_restart_pipeline.py
            python scripts/apply_no_micro_r23_restart_review.py
            python scripts/apply_sub2api_grok_compat_revision.py
            COMPOSER='legacy-explicit-chain'
          fi

          echo "composer=$COMPOSER" >> "$GITHUB_OUTPUT"

          grep -F "v-if=\"form.apiFormat === 'responses'\"" \
            frontend/src/components/provider/ProviderFormModal.vue
          if grep -q 'showSub2apiGrokCompat' frontend/src/components/provider/ProviderFormModal.vue; then
            echo '::error::Legacy compat-card visibility gate is still present'
            exit 1
          fi
          grep -F -q 'user_id/organizations' crates/proxy/src/resolver.rs
          grep -F -q 'CAS-SUB2API-GROK-TOOLSEARCH-ARGS-HOOK' crates/adapters/src/responses/grok_tool_shim.rs
          grep -F -q 'CAS-SUB2API-GROK-APPLY-PATCH-R14-BOOTSTRAP' crates/adapters/src/responses/grok_tool_shim.rs
          grep -F -q 'CAS-SUB2API-GROK-TERMINAL-COMPLETION-HOOK' crates/adapters/src/responses/grok_tool_shim.rs
          grep -F -q 'CAS-SUB2API-GROK-APPLY-PATCH-RECOVERY-R16-HOOK' crates/adapters/src/responses/grok_tool_shim.rs
          grep -F -q 'CAS-SUB2API-GROK-APPLY-PATCH-HARDENING-R17-TERMINAL-ID' crates/adapters/src/responses/grok_tool_shim.rs
          grep -F -q 'CAS-SUB2API-GROK-REPLAY-SCHEMA-HOOK' crates/adapters/src/mapper/grok_build.rs
          grep -F -q 'CAS-SUB2API-OPENAI-CODEX-IDENTITY-HOOK' crates/proxy/src/forward.rs
          grep -F -q 'CAS-NO-MICRO-R23-SHARED-RESTART-PIPELINE' src-tauri/src/admin/services/desktop/process.rs

          REVISION="$(tr -d '\r\n' < SUB2API_GROK_COMPAT_REVISION.txt)"
          [[ "$REVISION" =~ ^[0-9]+$ ]] || { echo '::error::Invalid compat revision'; exit 1; }
          if (( REVISION >= 24 )); then
            grep -F -q 'CAS-AUTO-REVIEW-R24' crates/codex_integration/src/auto_review_overlay.rs
          fi
          if (( REVISION >= 25 )); then
            grep -F -q 'CAS-APPS-MCP-AUTH-R25-REHYDRATE' crates/proxy/src/forward.rs
          fi
          if (( REVISION >= 26 )); then
            grep -F -q 'CAS-RUNTIME-DIAG-R26' src-tauri/src/runtime_diag.rs
          fi
          if (( REVISION >= 27 )); then
            grep -F -q 'CAS-PROXY-LIFECYCLE-R27' src-tauri/src/admin/handlers/proxy.rs
          fi
          if (( REVISION >= 28 )); then
            grep -F -q 'CAS-HYBRID-DIRECT-R28-GATEWAY-SYNC' src-tauri/src/admin/services/desktop/snapshot.rs
            grep -F -q 'CAS-HYBRID-DIRECT-R28-PROVIDER-REFRESH' src-tauri/src/admin/handlers/proxy.rs
          fi
          if (( REVISION >= 29 )); then
            grep -F -q 'CAS-AUTO-REVIEW-UI-R29-EDITOR' frontend/src/components/provider/ProviderFormModal.vue
          fi
          if (( REVISION >= 30 )); then
            grep -F -q 'CAS-R30-HYBRID-AUTO-REVIEW-CATALOG-ONLY' src-tauri/src/admin/services/desktop/snapshot.rs
          fi
          if (( REVISION >= 31 )); then
            grep -F -q 'CAS-AUTO-REVIEW-LAYOUT-R31' frontend/src/components/provider/ProviderFormModal.vue
            grep -F -q 'CAS-AUTO-REVIEW-LAYOUT-R31' frontend/src/components/provider/AutoReviewModelOverridesEditor.vue
          fi

      - name: Resolve visible compat version
        id: compat-version
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(python - <<'PY'
          import json
          print(json.load(open('src-tauri/tauri.conf.json', encoding='utf-8'))['version'])
          PY
          )"
          BASE_VERSION="${APP_VERSION%%+*}"
          if [[ "$APP_VERSION" == *+* ]]; then
            REVISION="${APP_VERSION#*+}"
          else
            REVISION="0"
          fi
          FILE_REVISION="$(tr -d '\r\n' < SUB2API_GROK_COMPAT_REVISION.txt)"
          SAFE_VERSION="${BASE_VERSION}-r${REVISION}"
          SHORT_SHA="$(git rev-parse --short=12 HEAD)"

          [[ "$REVISION" =~ ^[0-9]+$ ]] || { echo '::error::Tauri compat revision is not numeric'; exit 1; }
          test "$REVISION" = "$FILE_REVISION" || {
            echo "::error::Version identity mismatch: tauri=$REVISION revision-file=$FILE_REVISION"
            exit 1
          }
          grep -F -q "compat_revision=${REVISION}" SUB2API_GROK_COMPAT_VERSION.txt
          grep -F -q "app_version=${APP_VERSION}" SUB2API_GROK_COMPAT_VERSION.txt

          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "base_version=$BASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "safe_version=$SAFE_VERSION" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "Building Sub2API Grok Compat v${APP_VERSION} / r${REVISION} @ ${SHORT_SHA}"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          key: sub2api-grok-compat-windows

      - name: Normalize generated source
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check

      - name: Test r24 Auto Review catalog overlay
        run: cargo test -p codex-app-transfer-codex-integration auto_review_overlay --lib -- --nocapture

      - name: Check complete Windows runtime gates
        shell: bash
        env:
          REVISION: ${{ steps.compat-version.outputs.revision }}
        run: |
          set -euo pipefail
          if (( REVISION >= 27 )); then
            cargo test -p codex-app-transfer proxy_lifecycle_r27 --target x86_64-pc-windows-msvc -- --nocapture
          fi
          if (( REVISION >= 28 )); then
            cargo test -p codex-app-transfer hybrid_direct --target x86_64-pc-windows-msvc -- --nocapture
          fi
          if (( REVISION >= 27 )); then
            cargo check -p codex-app-transfer --target x86_64-pc-windows-msvc
          else
            cargo check -p codex-app-transfer-codex-integration --lib
          fi

      - name: Cache cargo-tauri binary
        id: cache-tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri.exe
          key: windows-cargo-tauri-cli-v2

      - name: Install tauri-cli
        if: steps.cache-tauri-cli.outputs.cache-hit != 'true'
        timeout-minutes: 25
        run: cargo install tauri-cli --version '^2' --locked

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build and verify frontend
        shell: bash
        env:
          APP_VERSION: ${{ steps.compat-version.outputs.app_version }}
          REVISION: ${{ steps.compat-version.outputs.revision }}
        run: |
          set -euo pipefail
          npm --prefix frontend ci
          npm --prefix frontend run build
          grep -R -F -q 'Grok MCP / Tools' frontend/dist
          grep -R -F -q "Sub2API Grok Compat r${REVISION}" frontend/dist
          grep -R -F -q "v${APP_VERSION}" frontend/dist
          grep -R -F -q 'No Micro' frontend/dist
          if (( REVISION >= 24 )); then
            grep -R -F -q 'Auto Review' frontend/dist
          fi
          if (( REVISION >= 28 )); then
            grep -R -F -q 'Hybrid Direct' frontend/dist
            grep -R -F -q 'CC Switch' frontend/dist
          fi
          echo "Verified frontend identity r${REVISION} / v${APP_VERSION}"

      - name: Test local proxy gateway auth
        run: cargo test -p codex-app-transfer-proxy --lib -- --nocapture

      - name: Test all adapter regressions
        run: cargo test -p codex-app-transfer-adapters --lib -- --nocapture

      - name: Build Windows NSIS + MSI
        working-directory: src-tauri
        env:
          CODEX_APP_TRANSFER_REPO: ${{ github.repository }}
        run: cargo tauri build --target x86_64-pc-windows-msvc --bundles nsis,msi

      - name: Stage version-identified Windows bundles
        shell: bash
        env:
          APP_VERSION: ${{ steps.compat-version.outputs.app_version }}
          REVISION: ${{ steps.compat-version.outputs.revision }}
          SAFE_VERSION: ${{ steps.compat-version.outputs.safe_version }}
          SHORT_SHA: ${{ steps.compat-version.outputs.short_sha }}
          COMPOSER: ${{ steps.composer.outputs.composer }}
        run: |
          set -euo pipefail
          BDIR="target/x86_64-pc-windows-msvc/release/bundle"
          mkdir -p staging
          shopt -s nullglob
          for f in "$BDIR"/nsis/*-setup.exe; do
            cp "$f" "staging/Codex-App-Transfer-Sub2API-Grok-Compat-${SAFE_VERSION}-Windows-x64-Setup.exe"
          done
          for f in "$BDIR"/msi/*.msi; do
            cp "$f" "staging/Codex-App-Transfer-Sub2API-Grok-Compat-${SAFE_VERSION}-Windows-x64.msi"
          done
          cat > staging/BUILD-INFO.txt <<EOF
          app_version=${APP_VERSION}
          compat_revision=${REVISION}
          git_commit=$(git rev-parse HEAD)
          git_short_commit=${SHORT_SHA}
          composer=${COMPOSER}
          EOF
          files=(staging/*)
          if (( ${#files[@]} < 3 )); then
            echo '::error::Expected NSIS, MSI, and BUILD-INFO.txt'
            find target -maxdepth 6 -type f | sort | tail -200 || true
            exit 1
          fi
          ls -lh staging/
          cat staging/BUILD-INFO.txt

      - uses: actions/upload-artifact@v4
        with:
          name: sub2api-grok-compat-${{ steps.compat-version.outputs.safe_version }}-windows-x64
          path: staging/*
          if-no-files-found: error
          retention-days: 30
