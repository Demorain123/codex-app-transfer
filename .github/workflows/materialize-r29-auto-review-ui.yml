name: Materialize r29 Auto Review UI

on:
  workflow_dispatch:
  push:
    branches:
      - sub2api-grok-compat-next-r29-auto-review-ui
    paths:
      - 'frontend/**'
      - 'src-tauri/**'
      - 'scripts/**'
      - 'SUB2API_GROK_COMPAT_REVISION.txt'
      - 'SUB2API_GROK_COMPAT_VERSION.txt'
      - '.github/workflows/materialize-r29-auto-review-ui.yml'
  pull_request:
    branches:
      - sub2api-grok-compat-next-r27-unified

permissions:
  contents: write

jobs:
  materialize-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          show-progress: false

      - name: Check r29 overlay Python syntax
        run: |
          python3 -m py_compile \
            scripts/apply_r29_unified.py \
            scripts/apply_auto_review_ui_r29_hardening.py \
            scripts/apply_auto_review_ui_r29.py \
            scripts/apply_auto_review_effective_r29.py \
            scripts/review_auto_review_ui_r29.py

      - name: Replay validated r27 unified base
        shell: bash
        run: |
          set -euo pipefail
          if ! python3 scripts/apply_r27_unified.py > "$RUNNER_TEMP/r27-replay.log" 2>&1; then
            tail -n 100 "$RUNNER_TEMP/r27-replay.log"
            exit 1
          fi
          echo 'r27 unified replay: PASS'

      - name: Restamp standard compat revision as r29
        shell: bash
        run: |
          set -euo pipefail
          printf '29\n' > SUB2API_GROK_COMPAT_REVISION.txt
          if ! python3 scripts/apply_sub2api_grok_compat_revision.py > "$RUNNER_TEMP/r29-restamp.log" 2>&1; then
            tail -n 100 "$RUNNER_TEMP/r29-restamp.log"
            exit 1
          fi
          echo 'r29 standard revision restamp: PASS'

      - name: Harden r29 UI replay generator
        run: python3 scripts/apply_auto_review_ui_r29_hardening.py

      - name: Apply r29 provider-model UI overlay
        run: python3 scripts/apply_auto_review_ui_r29.py

      - name: Apply r29 effective override wiring and live-sync companion
        run: python3 scripts/apply_auto_review_effective_r29.py

      - name: Run deep r29 Auto Review self-review
        id: deep-review
        shell: bash
        run: |
          set +e
          python3 scripts/review_auto_review_ui_r29.py > "$RUNNER_TEMP/r29-deep-review.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/r29-deep-review.log"
          exit $status

      - name: Stage exact r29 deep-review diagnostic
        if: failure() && steps.deep-review.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r29-review-diag/frontend/src/components/provider"
          mkdir -p "$RUNNER_TEMP/r29-review-diag/frontend/src/api"
          mkdir -p "$RUNNER_TEMP/r29-review-diag/src-tauri/src/admin/handlers/providers"
          cp "$RUNNER_TEMP/r29-deep-review.log" "$RUNNER_TEMP/r29-review-diag/"
          cp frontend/src/components/provider/ProviderFormModal.vue "$RUNNER_TEMP/r29-review-diag/frontend/src/components/provider/"
          cp frontend/src/components/provider/AutoReviewModelOverridesEditor.vue "$RUNNER_TEMP/r29-review-diag/frontend/src/components/provider/"
          cp frontend/src/api/providers.ts "$RUNNER_TEMP/r29-review-diag/frontend/src/api/"
          cp src-tauri/src/admin/handlers/providers/crud.rs "$RUNNER_TEMP/r29-review-diag/src-tauri/src/admin/handlers/providers/"

      - name: Upload exact r29 deep-review diagnostic
        if: failure() && steps.deep-review.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: r29-deep-review-diagnostic
          path: ${{ runner.temp }}/r29-review-diag
          if-no-files-found: error
          retention-days: 7

      - name: Check materialized text and version markers
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F -q 'compat_revision=29' SUB2API_GROK_COMPAT_VERSION.txt
          grep -F -q 'app_version=2.4.5+29' SUB2API_GROK_COMPAT_VERSION.txt
          grep -F -q 'CAS-AUTO-REVIEW-UI-R29-EDITOR' frontend/src/components/provider/ProviderFormModal.vue
          grep -F -q 'CAS-AUTO-REVIEW-UI-R29-SILENT-NO-SUGGEST' frontend/src/components/provider/ProviderFormModal.vue
          grep -F -q 'CAS-AUTO-REVIEW-R29-SAVE-FEEDBACK' frontend/src/components/provider/ProviderFormModal.vue
          grep -F -q 'CAS-AUTO-REVIEW-R29-API-WIRE-WRITE' frontend/src/api/providers.ts
          grep -F -q 'CAS-AUTO-REVIEW-R29-LIVE-APPLY' src-tauri/src/admin/handlers/providers/crud.rs
          grep -F -q 'CAS-AUTO-REVIEW-UI-R29' frontend/src/components/provider/AutoReviewModelOverridesEditor.vue
          test "$(grep -F -c 'pub mod auto_review_overlay; // CAS-AUTO-REVIEW-R24' crates/codex_integration/src/lib.rs)" = "1"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build r29 frontend
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix frontend ci
          npm --prefix frontend run build
          grep -R -F -q 'Sub2API Grok Compat r29' frontend/dist
          grep -R -F -q '添加映射' frontend/dist
          grep -R -F -q '刷新模型列表' frontend/dist
          grep -R -F -q '重启 Codex' frontend/dist

      - name: Normalize generated Rust before replay baseline
        shell: bash
        run: |
          set -euo pipefail
          rustup component add rustfmt
          cargo fmt --all
          git diff --check

      - name: Prove r29 overlay replay idempotence after rustfmt
        shell: bash
        run: |
          set -euo pipefail
          git diff --binary > "$RUNNER_TEMP/r29-first.diff"
          if ! python3 scripts/apply_r29_unified.py > "$RUNNER_TEMP/r29-second-replay.log" 2>&1; then
            tail -n 100 "$RUNNER_TEMP/r29-second-replay.log"
            exit 1
          fi
          cargo fmt --all
          python3 scripts/review_auto_review_ui_r29.py
          git diff --check
          git diff --binary > "$RUNNER_TEMP/r29-second.diff"
          if ! cmp -s "$RUNNER_TEMP/r29-first.diff" "$RUNNER_TEMP/r29-second.diff"; then
            echo '::error::r29 complete overlay is not idempotent after rustfmt'
            diff -u "$RUNNER_TEMP/r29-first.diff" "$RUNNER_TEMP/r29-second.diff" || true
            exit 1
          fi

      - name: Commit generated r29 source on push
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No generated source diff to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '[r29-generated] materialize provider-model Auto Review UI/effective override'
          git push origin HEAD:sub2api-grok-compat-next-r29-auto-review-ui
