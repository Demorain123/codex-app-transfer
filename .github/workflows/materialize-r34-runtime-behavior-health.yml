name: Materialize r34 Runtime Behavior Health

on:
  workflow_dispatch:
  push:
    branches:
      - sub2api-grok-compat-next-r34-runtime-behavior-health
    paths:
      - 'crates/**'
      - 'frontend/**'
      - 'src-tauri/**'
      - 'scripts/**'
      - 'docs/R34_RUNTIME_BEHAVIOR_HEALTH.md'
      - 'SUB2API_GROK_COMPAT_REVISION.txt'
      - 'SUB2API_GROK_COMPAT_VERSION.txt'
      - '.github/workflows/materialize-r34-runtime-behavior-health.yml'
  pull_request:
    branches:
      - sub2api-grok-compat-next-r33-chain-health

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  materialize-review:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check r34 overlay syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/apply_r34_unified.py \
            scripts/apply_r34_runtime_behavior_health.py \
            scripts/review_r34_runtime_behavior_health.py

      - name: Compose r24 through r34
        run: python scripts/apply_r34_unified.py

      - name: Check r34 identity, privacy, and behavior markers
        shell: bash
        run: |
          set -euo pipefail
          grep -F -q 'compat_revision=34' SUB2API_GROK_COMPAT_VERSION.txt
          grep -F -q 'app_version=2.4.5+34' SUB2API_GROK_COMPAT_VERSION.txt
          grep -F -q 'RequestLifecycleTracker' crates/proxy/src/telemetry.rs
          grep -F -q 'RequestLifecycleStreamR34' crates/proxy/src/forward.rs
          grep -F -q 'session_retry_recovered' src-tauri/src/admin/handlers/chain_health.rs
          grep -F -q 'mcp_process_explosion' src-tauri/src/admin/handlers/chain_health.rs
          grep -F -q 'container.restart_delta > 0' src-tauri/src/admin/handlers/chain_health.rs
          grep -F -q 'chainHealth.layer.session' frontend/src/pages/ProxyPage.vue
          grep -F -q 'chainHealth.layer.mcp' frontend/src/pages/ProxyPage.vue
          python scripts/review_r34_runtime_behavior_health.py
          git diff --check

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build r34 frontend
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix frontend ci
          npm --prefix frontend run build
          grep -R -F -q 'Sub2API Grok Compat r34' frontend/dist
          grep -R -F -q 'Session / Turn' frontend/dist
          grep -R -F -q 'MCP Health' frontend/dist
          grep -R -F -q '会话 / Turn' frontend/dist
          grep -R -F -q 'MCP 健康' frontend/dist

      - name: Install Tauri Linux prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file libayatana-appindicator3-dev libgtk-3-dev \
            librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf wget

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          key: r34-runtime-behavior-health-linux

      - name: Compile and test r34 backend
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo check -p codex-app-transfer
          cargo test -p codex-app-transfer chain_health -- --nocapture
          cargo test -p codex-app-transfer-proxy telemetry -- --nocapture
          python scripts/review_r34_runtime_behavior_health.py
          git diff --check

      - name: Prove complete r34 replay idempotence
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --binary > "$RUNNER_TEMP/r34-first.diff"
          python scripts/apply_r34_unified.py > "$RUNNER_TEMP/r34-second-replay.log" 2>&1 || {
            tail -n 260 "$RUNNER_TEMP/r34-second-replay.log"
            exit 1
          }
          cargo fmt --all
          python scripts/review_r34_runtime_behavior_health.py
          git diff --check
          git diff --binary > "$RUNNER_TEMP/r34-second.diff"
          if ! cmp -s "$RUNNER_TEMP/r34-first.diff" "$RUNNER_TEMP/r34-second.diff"; then
            echo '::error::r34 complete overlay is not idempotent after rustfmt'
            diff -u "$RUNNER_TEMP/r34-first.diff" "$RUNNER_TEMP/r34-second.diff" || true
            exit 1
          fi

      - name: Commit generated r34 source on push
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No generated source diff to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '[r34-generated] materialize runtime behavior health'
          git push origin HEAD:sub2api-grok-compat-next-r34-runtime-behavior-health
