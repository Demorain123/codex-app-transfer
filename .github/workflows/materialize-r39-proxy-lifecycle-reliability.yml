name: Materialize r39 Proxy Lifecycle Reliability

on:
  workflow_dispatch:
  push:
    branches:
      - sub2api-grok-compat-next-r39-proxy-lifecycle-reliability
    paths:
      - 'crates/**'
      - 'frontend/**'
      - 'src-tauri/**'
      - 'scripts/**'
      - 'docs/R39_PROXY_LIFECYCLE_RELIABILITY_RESEARCH_2026-08-18.md'
      - 'SUB2API_GROK_COMPAT_REVISION.txt'
      - 'SUB2API_GROK_COMPAT_VERSION.txt'
      - '.github/workflows/materialize-r39-proxy-lifecycle-reliability.yml'
  pull_request:
    branches:
      - sub2api-grok-compat-next-r38-model-route-observability

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  materialize-review-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compose r24 through r39
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/apply_r39_unified.py \
            scripts/apply_r39_proxy_lifecycle_reliability.py \
            scripts/review_r39_proxy_lifecycle_reliability.py
          python scripts/apply_r39_unified.py
          grep -F -q 'compat_revision=39' SUB2API_GROK_COMPAT_VERSION.txt
          grep -F -q 'app_version=2.4.5+39' SUB2API_GROK_COMPAT_VERSION.txt
          python scripts/review_r39_proxy_lifecycle_reliability.py
          git diff --check

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build r39 frontend
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix frontend ci
          npm --prefix frontend run build
          grep -R -F -q 'Sub2API Grok Compat r39' frontend/dist
          grep -R -F -q '正在恢复' frontend/dist

      - name: Install Tauri Linux prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file libayatana-appindicator3-dev libgtk-3-dev \
            librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf wget

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          key: r39-proxy-lifecycle-linux

      - name: Compile and test r39 backend
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo check -p codex-app-transfer
          cargo test -p codex-app-transfer lifecycle_r39 -- --nocapture
          cargo test -p codex-app-transfer proxy_lifecycle_r27 -- --nocapture
          cargo test -p codex-app-transfer chain_health -- --nocapture
          cargo test -p codex-app-transfer-proxy --lib -- --nocapture
          python scripts/review_r39_proxy_lifecycle_reliability.py
          git diff --check

      - name: Prove r39 replay idempotence
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --binary > "$RUNNER_TEMP/r39-first.diff"
          python scripts/apply_r39_unified.py > "$RUNNER_TEMP/r39-second.log" 2>&1 || {
            tail -n 300 "$RUNNER_TEMP/r39-second.log"
            exit 1
          }
          cargo fmt --all
          python scripts/review_r39_proxy_lifecycle_reliability.py
          git diff --check
          git diff --binary > "$RUNNER_TEMP/r39-second.diff"
          cmp -s "$RUNNER_TEMP/r39-first.diff" "$RUNNER_TEMP/r39-second.diff" || {
            echo '::error::r39 complete overlay is not idempotent after rustfmt'
            diff -u "$RUNNER_TEMP/r39-first.diff" "$RUNNER_TEMP/r39-second.diff" || true
            exit 1
          }

      - name: Commit generated r39 source on push
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '[r39-generated] materialize proxy lifecycle reliability'
          git push origin HEAD:sub2api-grok-compat-next-r39-proxy-lifecycle-reliability

  lifecycle-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compose r39 on Windows
        shell: pwsh
        run: |
          python scripts/apply_r39_unified.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/review_r39_proxy_lifecycle_reliability.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          key: r39-proxy-lifecycle-windows

      - name: Windows lifecycle regression gate
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check -p codex-app-transfer --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p codex-app-transfer lifecycle_r39 --target x86_64-pc-windows-msvc -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
