name: r14 PR runner

on:
  pull_request:
    branches:
      - sub2api-grok-compat

permissions:
  contents: write

jobs:
  run-r14-bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sub2api-grok-compat-r14
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt

      - name: Execute patch payload from bootstrap workflow
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python - <<'PY' > .r14-patch.log 2>&1
          from pathlib import Path

          workflow = Path('.github/workflows/r14-grok-apply-patch-fix.yml').read_text(encoding='utf-8')
          marker_start = "          python - <<'PY'\n"
          marker_end = "          PY\n\n      - name: Rustfmt check"
          start = workflow.index(marker_start) + len(marker_start)
          end = workflow.index(marker_end, start)
          raw = workflow[start:end]
          # The bootstrap embeds Rust multiline strings whose contents intentionally
          # start at column 0, so textwrap.dedent sees a zero-indent line and leaves the
          # Python statements indented. Strip only the YAML run-block prefix from lines
          # that actually have it; leave embedded string contents byte-for-byte intact.
          payload = ''.join(
              line[10:] if line.startswith('          ') else line
              for line in raw.splitlines(keepends=True)
          )
          exec(compile(payload, 'r14-bootstrap-inline.py', 'exec'), {})
          PY
          status=$?
          cat .r14-patch.log
          exit $status

      - name: Commit patch diagnostic on failure
        if: steps.patch.outcome == 'failure'
        shell: bash
        run: |
          printf '%s\n' 'r14 bootstrap patch step failed; see .r14-patch.log.' > .r14-error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .r14-error.txt .r14-patch.log
          git commit -m "chore(r14): capture bootstrap failure details"
          git push origin HEAD:sub2api-grok-compat-r14

      - name: Stop after patch failure
        if: always() && steps.patch.outcome == 'failure'
        run: exit 1

      - name: Rustfmt check
        if: steps.patch.outcome == 'success'
        run: cargo fmt --all -- --check

      - name: Grok shim regression tests
        if: steps.patch.outcome == 'success'
        run: cargo test -p codex-app-transfer-adapters grok_tool_shim --lib

      - name: Tauri crate check
        if: steps.patch.outcome == 'success'
        run: cargo check -p codex-app-transfer --locked

      - name: Commit r14 patch and remove bootstrap workflows
        if: steps.patch.outcome == 'success'
        shell: bash
        run: |
          rm -f .github/workflows/r14-grok-apply-patch-fix.yml .github/workflows/r14-pr-runner.yml .r14-error.txt .r14-patch.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "fix(grok): r14 harden apply_patch argument recovery"
          git push origin HEAD:sub2api-grok-compat-r14
