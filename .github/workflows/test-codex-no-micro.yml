name: Test Codex No Micro

on:
  workflow_dispatch:
  push:
    branches:
      - sub2api-grok-compat-next-no-micro-ui
    paths:
      - 'src-tauri/resources/codex_no_micro_launcher.mjs'
      - 'src-tauri/src/admin/services/desktop/no_micro.rs'
      - 'src-tauri/src/admin/services/desktop/process.rs'
      - 'src-tauri/src/admin/services/desktop/mod.rs'
      - 'src-tauri/src/admin/handlers/no_micro.rs'
      - 'src-tauri/src/admin/handlers/desktop.rs'
      - 'src-tauri/src/admin/handlers/mod.rs'
      - 'src-tauri/src/admin/mod.rs'
      - 'frontend/src/api/noMicro.ts'
      - 'frontend/src/components/codex/NoMicroPanel.vue'
      - 'frontend/src/pages/CodexPage.vue'
      - 'frontend/src/pages/ProvidersPage.vue'
      - 'scripts/no_micro_mock_fixture.mjs'
      - 'scripts/test_no_micro_launcher.mjs'
      - 'scripts/apply_no_micro_r23_restart_pipeline.py'
      - '.github/workflows/test-codex-no-micro.yml'
  pull_request:
    branches:
      - sub2api-grok-compat
    paths:
      - 'src-tauri/resources/codex_no_micro_launcher.mjs'
      - 'src-tauri/src/admin/services/desktop/no_micro.rs'
      - 'src-tauri/src/admin/services/desktop/process.rs'
      - 'src-tauri/src/admin/services/desktop/mod.rs'
      - 'src-tauri/src/admin/handlers/no_micro.rs'
      - 'src-tauri/src/admin/handlers/desktop.rs'
      - 'src-tauri/src/admin/handlers/mod.rs'
      - 'src-tauri/src/admin/mod.rs'
      - 'frontend/src/api/noMicro.ts'
      - 'frontend/src/components/codex/NoMicroPanel.vue'
      - 'frontend/src/pages/CodexPage.vue'
      - 'frontend/src/pages/ProvidersPage.vue'
      - 'scripts/no_micro_mock_fixture.mjs'
      - 'scripts/test_no_micro_launcher.mjs'
      - 'scripts/apply_no_micro_r23_restart_pipeline.py'
      - '.github/workflows/test-codex-no-micro.yml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  no-micro-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply r23 shared restart pipeline overlay
        shell: bash
        run: python scripts/apply_no_micro_r23_restart_pipeline.py

      - name: Verify r23 A/B shares the proven restart pipeline
        shell: bash
        run: |
          set -euo pipefail
          grep -F -q 'CAS-NO-MICRO-R23-SHARED-RESTART-PIPELINE' src-tauri/src/admin/services/desktop/process.rs
          grep -F -q 'launch_codex_app_restart_with' src-tauri/src/admin/services/desktop/process.rs
          grep -F -q 'CAS-NO-MICRO-R23-SHARED-DESKTOP-PREP' src-tauri/src/admin/handlers/desktop.rs
          grep -F -q 'prepare_codex_restart_runtime' src-tauri/src/admin/handlers/desktop.rs
          grep -F -q 'CAS-NO-MICRO-R23-LAUNCH-ARGS' src-tauri/src/admin/services/desktop/no_micro.rs
          grep -F -q 'launch_with_args' src-tauri/src/admin/services/desktop/no_micro.rs
          grep -F -q 'CAS-NO-MICRO-R23-AB-SHARED-PIPELINE' src-tauri/src/admin/handlers/no_micro.rs
          grep -F -q 'process::launch_codex_app_restart(std::env::consts::OS)' src-tauri/src/admin/handlers/no_micro.rs
          grep -F -q 'process::launch_codex_app_restart_with(std::env::consts::OS' src-tauri/src/admin/handlers/no_micro.rs
          grep -F -q 'pipeline=legacy-restart-shared' src-tauri/src/admin/handlers/no_micro.rs
          if grep -F -q 'activate_packaged_app(&aumid, "")' src-tauri/src/admin/handlers/no_micro.rs; then
            echo '::error::A still has an independent MSIX activation path instead of legacy restart'
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Check launcher syntax
        run: node --check src-tauri/resources/codex_no_micro_launcher.mjs

      - name: Run No Micro inspector + Worker mock
        shell: pwsh
        run: |
          node scripts/test_no_micro_launcher.mjs 2>&1 | Tee-Object -FilePath no-micro-mock.log
          $code = $LASTEXITCODE
          exit $code

      - name: Verify explicit A/B log markers and controls
        shell: bash
        run: |
          set -euo pipefail
          grep -F -q '[codex-ab]' src-tauri/src/admin/handlers/no_micro.rs
          grep -F -q '"normal", "launch_requested"' src-tauri/src/admin/handlers/no_micro.rs
          grep -F -q '"launch_success"' src-tauri/src/admin/handlers/no_micro.rs
          grep -F -q '"no-micro"' src-tauri/src/admin/handlers/no_micro.rs
          grep -F -q '"injection_success"' src-tauri/src/admin/handlers/no_micro.rs
          grep -F -q 'proxy_telemetry()' src-tauri/src/admin/handlers/no_micro.rs
          grep -F -q '普通启动（A）' frontend/src/components/codex/NoMicroPanel.vue
          grep -F -q 'No Micro 启动（B）' frontend/src/components/codex/NoMicroPanel.vue
          grep -F -q 'NoMicroPanel' frontend/src/pages/ProvidersPage.vue
          if grep -F -q 'NoMicroPanel' frontend/src/pages/CodexPage.vue; then
            echo '::error::No Micro panel must not be rendered in Codex/Docs page'
            exit 1
          fi

      - name: Upload No Micro mock failure diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: no-micro-mock-failure
          path: no-micro-mock.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Build frontend
        run: npm --prefix frontend run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          key: no-micro-windows

      - name: Format Rust for validation
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check
          git diff -- \
            src-tauri/src/admin/services/desktop/no_micro.rs \
            src-tauri/src/admin/services/desktop/process.rs \
            src-tauri/src/admin/services/desktop/mod.rs \
            src-tauri/src/admin/handlers/no_micro.rs \
            src-tauri/src/admin/handlers/desktop.rs \
            src-tauri/src/admin/handlers/mod.rs \
            src-tauri/src/admin/mod.rs > no-micro-rustfmt.diff

      - name: Upload rustfmt patch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: no-micro-rustfmt
          path: no-micro-rustfmt.diff
          if-no-files-found: ignore
          retention-days: 7

      - name: Check Tauri application
        run: cargo check -p codex-app-transfer

      - name: Run No Micro Rust unit tests
        run: cargo test -p codex-app-transfer no_micro -- --nocapture
