name: Test r24 Auto Review Catalog Overlay

on:
  push:
    branches:
      - sub2api-grok-compat-next-r24-auto-review-overlay
    paths:
      - 'scripts/apply_auto_review_model_overlay_r24.py'
      - 'scripts/apply_auto_review_model_overlay_r24_hardening.py'
      - 'scripts/apply_sub2api_grok_compat_revision.py'
      - 'crates/codex_integration/**'
      - 'src-tauri/src/admin/handlers/providers/**'
      - 'src-tauri/src/admin/services/desktop/snapshot.rs'
      - 'frontend/src/components/provider/ProviderFormModal.vue'
      - 'frontend/src/api/types.ts'
      - 'frontend/src/i18n/**'
      - 'SUB2API_GROK_COMPAT_REVISION.txt'
      - '.github/workflows/test-r24-auto-review.yml'
  pull_request:
    branches:
      - sub2api-grok-compat-next-no-micro-ui
    paths:
      - 'scripts/apply_auto_review_model_overlay_r24.py'
      - 'scripts/apply_auto_review_model_overlay_r24_hardening.py'
      - 'scripts/apply_sub2api_grok_compat_revision.py'
      - 'crates/codex_integration/**'
      - 'src-tauri/src/admin/handlers/providers/**'
      - 'src-tauri/src/admin/services/desktop/snapshot.rs'
      - 'frontend/src/components/provider/ProviderFormModal.vue'
      - 'frontend/src/api/types.ts'
      - 'frontend/src/i18n/**'
      - 'SUB2API_GROK_COMPAT_REVISION.txt'
      - '.github/workflows/test-r24-auto-review.yml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate-r24:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply r24 overlay through production revision path
        run: python3 scripts/apply_sub2api_grok_compat_revision.py

      - name: Verify generated invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -F -q 'CAS-AUTO-REVIEW-R24' crates/codex_integration/src/auto_review_overlay.rs
          grep -F -q 'restore_source_if_overlay_active(paths)?' crates/codex_integration/src/apply.rs
          grep -F -q 'auto_review_model_overrides' crates/codex_integration/src/apply.rs
          grep -F -q 'autoReviewModelOverrides' src-tauri/src/admin/handlers/providers/crud.rs
          grep -F -q 'autoReviewModelOverrides' frontend/src/components/provider/ProviderFormModal.vue
          grep -F -q '"grok-4.5":"gpt-5.6-luna"' frontend/src/components/provider/ProviderFormModal.vue
          grep -F -q 'compat_revision=24' SUB2API_GROK_COMPAT_VERSION.txt

      - name: Prove overlay replay is idempotent
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_sub2api_grok_compat_revision.py
          grep -F -q 'CAS-AUTO-REVIEW-R24' crates/codex_integration/src/auto_review_overlay.rs

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format generated Rust
        run: cargo fmt --all

      - name: Unit test copy-on-write catalog semantics
        run: cargo test -p codex-app-transfer-codex-integration auto_review_overlay --lib -- --nocapture

      - name: Check Codex integration crate
        run: cargo check -p codex-app-transfer-codex-integration --lib

      - name: Check Tauri backend compilation
        run: cargo check -p codex-app-transfer

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

      - name: Show r24 generated diff
        if: always()
        shell: bash
        run: |
          git status --short
          git diff -- \
            crates/codex_integration/src/auto_review_overlay.rs \
            crates/codex_integration/src/lib.rs \
            crates/codex_integration/src/apply.rs \
            src-tauri/src/admin/handlers/providers/mod.rs \
            src-tauri/src/admin/handlers/providers/crud.rs \
            src-tauri/src/admin/services/desktop/snapshot.rs \
            frontend/src/api/types.ts \
            frontend/src/components/provider/ProviderFormModal.vue \
            frontend/src/i18n/zh.ts \
            frontend/src/i18n/en.ts \
            src-tauri/tauri.conf.json \
            src-tauri/Cargo.toml \
            Cargo.lock \
            SUB2API_GROK_COMPAT_VERSION.txt || true
