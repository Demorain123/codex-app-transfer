name: Test r27 Unified Windows Package

on:
  workflow_dispatch:
  push:
    branches:
      - sub2api-grok-compat-next-r27-unified
    paths:
      - 'crates/**'
      - 'src-tauri/**'
      - 'frontend/**'
      - 'scripts/**'
      - 'SUB2API_GROK_COMPAT_REVISION.txt'
      - 'SUB2API_GROK_COMPAT_VERSION.txt'
      - 'Cargo.lock'
      - '.github/workflows/test-r27-windows-package.yml'
  pull_request:
    branches:
      - sub2api-grok-compat-next-r25-apps-mcp-auth
    paths:
      - 'crates/**'
      - 'src-tauri/**'
      - 'frontend/**'
      - 'scripts/**'
      - 'SUB2API_GROK_COMPAT_REVISION.txt'
      - 'SUB2API_GROK_COMPAT_VERSION.txt'
      - 'Cargo.lock'
      - '.github/workflows/test-r27-windows-package.yml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  package-r27-windows:
    runs-on: windows-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compose r24 + r25 + r26 + r27 proxy lifecycle
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/apply_r27_unified.py \
            scripts/apply_proxy_lifecycle_r27.py \
            scripts/apply_apps_mcp_auth_r25_r24_replay_fix.py \
            scripts/apply_runtime_diag_r26.py \
            scripts/apply_runtime_diag_r26_review.py
          python scripts/apply_r27_unified.py
          grep -F -q 'CAS-AUTO-REVIEW-R24' crates/codex_integration/src/auto_review_overlay.rs
          grep -F -q 'CAS-APPS-MCP-AUTH-R25-REHYDRATE' crates/proxy/src/forward.rs
          grep -F -q 'CAS-RUNTIME-DIAG-R26' src-tauri/src/runtime_diag.rs
          grep -F -q 'CAS-PROXY-LIFECYCLE-R27' src-tauri/src/admin/handlers/proxy.rs
          grep -F -q 'compat_revision=27' SUB2API_GROK_COMPAT_VERSION.txt
          test "$(grep -F -c 'pub mod auto_review_overlay; // CAS-AUTO-REVIEW-R24' crates/codex_integration/src/lib.rs)" = "1"

      - name: Resolve r27 package version
        id: compat-version
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(python - <<'PY'
          import json
          print(json.load(open('src-tauri/tauri.conf.json', encoding='utf-8'))['version'])
          PY
          )"
          BASE_VERSION="${APP_VERSION%%+*}"
          REVISION="${APP_VERSION#*+}"
          SAFE_VERSION="${BASE_VERSION}-r${REVISION}"
          test "$REVISION" = "27"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "safe_version=$SAFE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Packaging unified Sub2API Grok Compat v${APP_VERSION} / r${REVISION}"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          key: r27-unified-windows-package

      - name: Normalize generated Rust
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check

      - name: Prove complete r27 replay idempotence
        shell: bash
        run: |
          set -euo pipefail
          git diff --binary > "$RUNNER_TEMP/r27-first.diff"
          python scripts/apply_r27_unified.py
          cargo fmt --all
          git diff --check
          git diff --binary > "$RUNNER_TEMP/r27-second.diff"
          if ! cmp -s "$RUNNER_TEMP/r27-first.diff" "$RUNNER_TEMP/r27-second.diff"; then
            echo '::error::r27 complete overlay is not idempotent after rustfmt'
            diff -u "$RUNNER_TEMP/r27-first.diff" "$RUNNER_TEMP/r27-second.diff" || true
            exit 1
          fi

      - name: Recheck r24 Auto Review copy-on-write semantics
        run: cargo test -p codex-app-transfer-codex-integration auto_review_overlay --lib -- --nocapture

      - name: Run r25 Apps MCP auth regressions
        run: cargo test -p codex-app-transfer-proxy --lib apps_mcp_auth_r25 -- --nocapture

      - name: Run r26 subagent failure-chain regressions
        run: cargo test -p codex-app-transfer-proxy --lib subagent_failure_chain_r26 -- --nocapture

      - name: Run r27 proxy lifecycle regressions
        run: cargo test -p codex-app-transfer proxy_lifecycle_r27 --target x86_64-pc-windows-msvc -- --nocapture

      - name: Compile complete unified Windows app
        run: cargo check -p codex-app-transfer --target x86_64-pc-windows-msvc

      - name: Test adapter regressions
        run: cargo test -p codex-app-transfer-adapters --lib -- --nocapture

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build and verify frontend identity/features
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix frontend ci
          npm --prefix frontend run build
          grep -R -F -q 'Sub2API Grok Compat r27' frontend/dist
          grep -R -F -q 'No Micro' frontend/dist
          grep -R -F -q 'Auto Review' frontend/dist
          grep -R -F -q 'Grok MCP / Tools' frontend/dist

      - name: Cache cargo-tauri binary
        id: cache-tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri.exe
          key: windows-cargo-tauri-cli-v2

      - name: Install tauri-cli
        if: steps.cache-tauri-cli.outputs.cache-hit != 'true'
        timeout-minutes: 25
        run: cargo install tauri-cli --version '^2' --locked

      - name: Build Windows NSIS and MSI
        working-directory: src-tauri
        env:
          CODEX_APP_TRANSFER_REPO: ${{ github.repository }}
        run: cargo tauri build --target x86_64-pc-windows-msvc --bundles nsis,msi

      - name: Stage r27 Windows bundles
        shell: bash
        env:
          SAFE_VERSION: ${{ steps.compat-version.outputs.safe_version }}
        run: |
          set -euo pipefail
          BDIR="target/x86_64-pc-windows-msvc/release/bundle"
          mkdir -p staging
          shopt -s nullglob
          for f in "$BDIR"/nsis/*-setup.exe; do
            cp "$f" "staging/Codex-App-Transfer-Sub2API-Grok-Compat-${SAFE_VERSION}-Windows-x64-Setup.exe"
          done
          for f in "$BDIR"/msi/*.msi; do
            cp "$f" "staging/Codex-App-Transfer-Sub2API-Grok-Compat-${SAFE_VERSION}-Windows-x64.msi"
          done
          files=(staging/*)
          if (( ${#files[@]} == 0 )); then
            echo '::error::No r27 Windows bundles found'
            exit 1
          fi
          ls -lh staging/

      - uses: actions/upload-artifact@v4
        with:
          name: sub2api-grok-compat-${{ steps.compat-version.outputs.safe_version }}-windows-x64
          path: staging/*
          if-no-files-found: error
          retention-days: 30
