name: Diagnose r28 Hybrid Direct Materialization

on:
  workflow_dispatch:
  push:
    branches:
      - sub2api-grok-compat-next-r28-hybrid-direct
    paths:
      - 'scripts/apply_r28_hybrid_direct.py'
      - 'scripts/apply_hybrid_direct_r28.py'
      - 'scripts/review_hybrid_direct_r28.py'
      - 'scripts/hybrid_direct_r28.rs'
      - '.github/workflows/test-r28-materialization-diagnostic.yml'
  pull_request:
    branches:
      - sub2api-grok-compat-next-r27-unified

permissions:
  contents: read

jobs:
  diagnose-r28-materialization:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run r28 composer and capture exact failure
        id: compose
        shell: bash
        continue-on-error: true
        run: |
          set +e
          python scripts/apply_r28_hybrid_direct.py > "$RUNNER_TEMP/r28-compose.log" 2>&1
          code=$?
          cat "$RUNNER_TEMP/r28-compose.log"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Upload focused r28 compose log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r28-materialization-diagnostic
          path: ${{ runner.temp }}/r28-compose.log
          if-no-files-found: error
          retention-days: 7
      - name: Preserve composer result
        if: always()
        shell: bash
        env:
          CODE: ${{ steps.compose.outputs.exit_code }}
        run: |
          if [[ "${CODE:-1}" != "0" ]]; then
            echo "::error::r28 composer failed with exit code ${CODE:-unknown}"
            exit 1
          fi
