name: Test r30 Unified Windows Package

on:
  workflow_dispatch:
  push:
    branches:
      - sub2api-grok-compat-next-r30-unified
    paths:
      - 'crates/**'
      - 'src-tauri/**'
      - 'frontend/**'
      - 'scripts/**'
      - 'docs/**'
      - 'SUB2API_GROK_COMPAT_REVISION.txt'
      - 'SUB2API_GROK_COMPAT_VERSION.txt'
      - 'Cargo.lock'
      - '.github/workflows/test-r30-windows-package.yml'
  pull_request:
    branches:
      - sub2api-grok-compat-next-r28-hybrid-direct

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  package-r30-windows:
    runs-on: windows-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compose r24 through r30 unified stack
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/apply_r30_unified.py \
            scripts/apply_r30_hybrid_auto_review.py \
            scripts/apply_r30_catalog_import_fix.py \
            scripts/apply_r30_catalog_lifecycle.py \
            scripts/apply_r30_catalog_mutation_truth.py \
            scripts/review_r30_unified.py \
            scripts/apply_r28_hybrid_direct.py \
            scripts/apply_auto_review_ui_r29_hardening.py \
            scripts/apply_auto_review_ui_r29.py \
            scripts/apply_auto_review_effective_r29.py \
            scripts/review_auto_review_ui_r29.py
          python scripts/apply_r30_unified.py
          grep -F -q 'compat_revision=30' SUB2API_GROK_COMPAT_VERSION.txt
          grep -F -q 'app_version=2.4.5+30' SUB2API_GROK_COMPAT_VERSION.txt
          grep -F -q 'CAS-HYBRID-DIRECT-R28-GATEWAY-SYNC' src-tauri/src/admin/services/desktop/snapshot.rs
          grep -F -q 'CAS-AUTO-REVIEW-UI-R29-EDITOR' frontend/src/components/provider/ProviderFormModal.vue
          grep -F -q 'CAS-R30-HYBRID-AUTO-REVIEW-CATALOG-ONLY' src-tauri/src/admin/services/desktop/snapshot.rs
          grep -F -q 'CAS-R30-HYBRID-AUTO-REVIEW-DISPATCH' src-tauri/src/admin/handlers/providers/crud.rs
          grep -F -q 'CAS-R30-HYBRID-CATALOG-REFRESH' src-tauri/src/admin/services/desktop/snapshot.rs
          grep -F -q 'CAS-R30-HYBRID-CATALOG-EXIT-RESTORE' src-tauri/src/admin/services/desktop/snapshot.rs
          grep -F -q 'CAS-R30-CATALOG-MUTATION-TRUTH' src-tauri/src/admin/services/desktop/snapshot.rs
          python scripts/review_r30_unified.py

      - name: Resolve r30 package version
        id: compat-version
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(python - <<'PY'
          import json
          print(json.load(open('src-tauri/tauri.conf.json', encoding='utf-8'))['version'])
          PY
          )"
          BASE_VERSION="${APP_VERSION%%+*}"
          REVISION="${APP_VERSION#*+}"
          SAFE_VERSION="${BASE_VERSION}-r${REVISION}"
          test "$REVISION" = '30'
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "safe_version=$SAFE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Packaging unified Sub2API Grok Compat v${APP_VERSION} / r${REVISION}"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          key: r30-unified-windows-package

      - name: Normalize generated Rust and check patch cleanliness
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check
          python scripts/review_r30_unified.py

      - name: Prove complete r30 replay idempotence after rustfmt
        shell: bash
        run: |
          set -euo pipefail
          git diff --binary > "$RUNNER_TEMP/r30-first.diff"
          python scripts/apply_r30_unified.py > "$RUNNER_TEMP/r30-second-replay.log" 2>&1 || {
            tail -n 150 "$RUNNER_TEMP/r30-second-replay.log"
            exit 1
          }
          cargo fmt --all
          python scripts/review_r30_unified.py
          git diff --check
          git diff --binary > "$RUNNER_TEMP/r30-second.diff"
          if ! cmp -s "$RUNNER_TEMP/r30-first.diff" "$RUNNER_TEMP/r30-second.diff"; then
            echo '::error::r30 complete overlay is not idempotent after rustfmt'
            diff -u "$RUNNER_TEMP/r30-first.diff" "$RUNNER_TEMP/r30-second.diff" || true
            exit 1
          fi

      - name: Recheck r24 Auto Review copy-on-write semantics
        run: cargo test -p codex-app-transfer-codex-integration auto_review_overlay --lib -- --nocapture

      - name: Recheck r25 Apps MCP auth regressions
        run: cargo test -p codex-app-transfer-proxy --lib apps_mcp_auth_r25 -- --nocapture

      - name: Recheck r26 subagent failure-chain regressions
        run: cargo test -p codex-app-transfer-proxy --lib subagent_failure_chain_r26 -- --nocapture

      - name: Compile complete r30 Windows app
        id: msvc-check
        shell: bash
        run: |
          set +e
          cargo check -p codex-app-transfer --target x86_64-pc-windows-msvc > "$RUNNER_TEMP/r30-msvc-check.log" 2>&1
          status=$?
          tail -n 250 "$RUNNER_TEMP/r30-msvc-check.log"
          exit $status

      - name: Upload r30 MSVC compile diagnostic
        if: failure() && steps.msvc-check.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: r30-msvc-compile-diagnostic
          path: ${{ runner.temp }}/r30-msvc-check.log
          if-no-files-found: error
          retention-days: 7

      - name: Recheck r27 proxy lifecycle regressions
        id: r27-regression
        shell: bash
        run: |
          set +e
          cargo test -p codex-app-transfer proxy_lifecycle_r27 --target x86_64-pc-windows-msvc -- --nocapture > "$RUNNER_TEMP/r30-r27-regression.log" 2>&1
          status=$?
          tail -n 250 "$RUNNER_TEMP/r30-r27-regression.log"
          exit $status

      - name: Upload r27 regression diagnostic
        if: failure() && steps.r27-regression.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: r30-r27-regression-diagnostic
          path: ${{ runner.temp }}/r30-r27-regression.log
          if-no-files-found: error
          retention-days: 7

      - name: Recheck r28 Hybrid Direct safety invariants
        run: cargo test -p codex-app-transfer hybrid_direct --target x86_64-pc-windows-msvc -- --nocapture

      - name: Test adapter regressions
        run: cargo test -p codex-app-transfer-adapters --lib -- --nocapture

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build and verify r30 frontend
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix frontend ci
          npm --prefix frontend run build
          grep -R -F -q 'Sub2API Grok Compat r30' frontend/dist
          grep -R -F -q 'Hybrid Direct' frontend/dist
          grep -R -F -q 'CC Switch' frontend/dist
          grep -R -F -q '添加映射' frontend/dist
          grep -R -F -q '刷新模型列表' frontend/dist
          grep -R -F -q 'Auto Review' frontend/dist
          grep -R -F -q 'No Micro' frontend/dist

      - name: Cache cargo-tauri binary
        id: cache-tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri.exe
          key: windows-cargo-tauri-cli-v2

      - name: Install tauri-cli
        if: steps.cache-tauri-cli.outputs.cache-hit != 'true'
        timeout-minutes: 25
        run: cargo install tauri-cli --version '^2' --locked

      - name: Build Windows NSIS and MSI
        working-directory: src-tauri
        env:
          CODEX_APP_TRANSFER_REPO: ${{ github.repository }}
        run: cargo tauri build --target x86_64-pc-windows-msvc --bundles nsis,msi

      - name: Stage r30 Windows bundles
        shell: bash
        env:
          SAFE_VERSION: ${{ steps.compat-version.outputs.safe_version }}
        run: |
          set -euo pipefail
          BDIR="target/x86_64-pc-windows-msvc/release/bundle"
          mkdir -p staging
          shopt -s nullglob
          for f in "$BDIR"/nsis/*-setup.exe; do
            cp "$f" "staging/Codex-App-Transfer-Sub2API-Grok-Compat-${SAFE_VERSION}-Windows-x64-Setup.exe"
          done
          for f in "$BDIR"/msi/*.msi; do
            cp "$f" "staging/Codex-App-Transfer-Sub2API-Grok-Compat-${SAFE_VERSION}-Windows-x64.msi"
          done
          files=(staging/*)
          if (( ${#files[@]} == 0 )); then
            echo '::error::No r30 Windows bundles found'
            find target -maxdepth 6 -type f | sort | tail -200 || true
            exit 1
          fi
          ls -lh staging/

      - uses: actions/upload-artifact@v4
        with:
          name: sub2api-grok-compat-${{ steps.compat-version.outputs.safe_version }}-windows-x64
          path: staging/*
          if-no-files-found: error
          retention-days: 30
