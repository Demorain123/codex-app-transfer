name: Validate Sub2API Grok Overlay on Upstream

on:
  workflow_dispatch:
  push:
    branches:
      - sub2api-grok-compat
      - 'sub2api-grok-compat-next-*'
    paths:
      - 'scripts/apply_sub2api_grok_compat.py'
      - 'scripts/apply_sub2api_grok_compat_ui.py'
      - 'SUB2API_GROK_COMPAT_UPSTREAM_BASE.txt'
      - '.github/workflows/validate-sub2api-grok-overlay-on-upstream.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/apply_sub2api_grok_compat.py'
      - 'scripts/apply_sub2api_grok_compat_ui.py'
      - 'SUB2API_GROK_COMPAT_UPSTREAM_BASE.txt'
      - '.github/workflows/validate-sub2api-grok-overlay-on-upstream.yml'

permissions:
  contents: read

jobs:
  pristine-upstream-overlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # On PRs validate the real head, not GitHub's synthetic merge commit.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Preserve overlay assets and reset to the exact pristine base
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cp scripts/apply_sub2api_grok_compat.py "$tmp/"
          cp scripts/apply_sub2api_grok_compat_ui.py "$tmp/"

          # Candidate branches created by the sync script carry the exact upstream
          # commit in line 2. The long-lived compat branch falls back to fork main.
          base_sha=""
          if test -f SUB2API_GROK_COMPAT_UPSTREAM_BASE.txt; then
            base_sha="$(sed -n '2p' SUB2API_GROK_COMPAT_UPSTREAM_BASE.txt | tr -d '\r' | xargs)"
          fi
          if test -z "$base_sha"; then
            git fetch origin main
            base_sha="$(git rev-parse origin/main)"
          fi

          git cat-file -e "${base_sha}^{commit}"
          git reset --hard "$base_sha"
          git clean -fdx

          mkdir -p scripts
          cp "$tmp/apply_sub2api_grok_compat.py" scripts/
          cp "$tmp/apply_sub2api_grok_compat_ui.py" scripts/

          python3 scripts/apply_sub2api_grok_compat.py
          python3 scripts/apply_sub2api_grok_compat_ui.py

          echo "Pristine base SHA: $base_sha"
          git status --short

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          key: sub2api-overlay-pristine-upstream

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Format and verify overlay idempotence
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check
          git diff --binary > /tmp/overlay-first.diff

          # Reapplying the overlay must be a no-op after formatting. This catches
          # patchers that duplicate hooks/fields on future upstream versions.
          python3 scripts/apply_sub2api_grok_compat.py
          python3 scripts/apply_sub2api_grok_compat_ui.py
          cargo fmt --all
          git diff --check
          git diff --binary > /tmp/overlay-second.diff

          if ! cmp -s /tmp/overlay-first.diff /tmp/overlay-second.diff; then
            echo '::error::Overlay patchers are not idempotent.'
            diff -u /tmp/overlay-first.diff /tmp/overlay-second.diff > /tmp/overlay-idempotence.diff || true
            cat /tmp/overlay-idempotence.diff || true
            exit 1
          fi

      - name: Upload overlay idempotence diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: overlay-idempotence-failure
          path: /tmp/overlay-idempotence.diff
          if-no-files-found: ignore
          retention-days: 7

      - name: Build frontend from pristine upstream + overlay
        shell: bash
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

      - name: Test all adapter regressions from pristine upstream + overlay
        run: cargo test -p codex-app-transfer-adapters --lib -- --nocapture
