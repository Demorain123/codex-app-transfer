name: Validate Sub2API Grok Overlay on Upstream

on:
  workflow_dispatch:
  push:
    branches:
      - sub2api-grok-compat
      - 'sub2api-grok-compat-next-*'
    paths:
      - 'scripts/apply_sub2api_grok_compat.py'
      - 'scripts/sub2api_grok_compat_overlay.rs'
      - 'scripts/apply_sub2api_grok_compat_ui.py'
      - 'scripts/apply_sub2api_grok_compat_ui_dispatch.py'
      - 'scripts/apply_sub2api_grok_gateway_auth.py'
      - 'scripts/apply_sub2api_grok_compat_revision.py'
      - 'SUB2API_GROK_COMPAT_REVISION.txt'
      - 'SUB2API_GROK_COMPAT_UPSTREAM_BASE.txt'
      - '.github/workflows/validate-sub2api-grok-overlay-on-upstream.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/apply_sub2api_grok_compat.py'
      - 'scripts/sub2api_grok_compat_overlay.rs'
      - 'scripts/apply_sub2api_grok_compat_ui.py'
      - 'scripts/apply_sub2api_grok_compat_ui_dispatch.py'
      - 'scripts/apply_sub2api_grok_gateway_auth.py'
      - 'scripts/apply_sub2api_grok_compat_revision.py'
      - 'SUB2API_GROK_COMPAT_REVISION.txt'
      - 'SUB2API_GROK_COMPAT_UPSTREAM_BASE.txt'
      - '.github/workflows/validate-sub2api-grok-overlay-on-upstream.yml'

permissions:
  contents: read

jobs:
  pristine-upstream-overlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Preserve overlay assets and reset to the exact pristine base
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cp scripts/apply_sub2api_grok_compat.py "$tmp/"
          cp scripts/sub2api_grok_compat_overlay.rs "$tmp/"
          cp scripts/apply_sub2api_grok_compat_ui.py "$tmp/"
          cp scripts/apply_sub2api_grok_compat_ui_dispatch.py "$tmp/"
          cp scripts/apply_sub2api_grok_gateway_auth.py "$tmp/"
          cp scripts/apply_sub2api_grok_compat_revision.py "$tmp/"
          cp SUB2API_GROK_COMPAT_REVISION.txt "$tmp/"

          base_sha=""
          if test -f SUB2API_GROK_COMPAT_UPSTREAM_BASE.txt; then
            base_sha="$(sed -n '2p' SUB2API_GROK_COMPAT_UPSTREAM_BASE.txt | tr -d '\r' | xargs)"
          fi
          if test -z "$base_sha"; then
            git fetch origin main
            base_sha="$(git rev-parse origin/main)"
          fi

          git cat-file -e "${base_sha}^{commit}"
          git reset --hard "$base_sha"
          git clean -fdx

          mkdir -p scripts
          cp "$tmp/apply_sub2api_grok_compat.py" scripts/
          cp "$tmp/sub2api_grok_compat_overlay.rs" scripts/
          cp "$tmp/apply_sub2api_grok_compat_ui.py" scripts/
          cp "$tmp/apply_sub2api_grok_compat_ui_dispatch.py" scripts/
          cp "$tmp/apply_sub2api_grok_gateway_auth.py" scripts/
          cp "$tmp/apply_sub2api_grok_compat_revision.py" scripts/
          cp "$tmp/SUB2API_GROK_COMPAT_REVISION.txt" ./

          python3 scripts/apply_sub2api_grok_compat.py
          python3 scripts/apply_sub2api_grok_compat_ui_dispatch.py
          python3 scripts/apply_sub2api_grok_gateway_auth.py
          python3 scripts/apply_sub2api_grok_compat_revision.py

          echo "Pristine base SHA: $base_sha"
          cat SUB2API_GROK_COMPAT_VERSION.txt
          git status --short

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          key: sub2api-overlay-pristine-upstream

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Format and verify overlay idempotence
        shell: bash
        run: |
          log="$GITHUB_WORKSPACE/overlay-idempotence.log"
          rm -f "$GITHUB_WORKSPACE/overlay-idempotence.diff"
          set +e
          (
            set -euo pipefail
            echo '=== first application: rustfmt + diff ==='
            cargo fmt --all
            git diff --check
            git diff --binary > /tmp/overlay-first.diff

            echo '=== second application ==='
            python3 scripts/apply_sub2api_grok_compat.py
            python3 scripts/apply_sub2api_grok_compat_ui_dispatch.py
            python3 scripts/apply_sub2api_grok_gateway_auth.py
            python3 scripts/apply_sub2api_grok_compat_revision.py
            cargo fmt --all
            git diff --check
            git diff --binary > /tmp/overlay-second.diff

            echo '=== compare ==='
            if ! cmp -s /tmp/overlay-first.diff /tmp/overlay-second.diff; then
              echo 'Overlay patchers are not idempotent.'
              {
                echo '=== unified diff: first application vs second application ==='
                diff -u /tmp/overlay-first.diff /tmp/overlay-second.diff || true
                echo
                echo '=== git status after second application ==='
                git status --short
                echo
                echo '=== git diff --stat after second application ==='
                git diff --stat
              } > "$GITHUB_WORKSPACE/overlay-idempotence.diff"
              exit 1
            fi
            echo 'Overlay patchers are idempotent after rustfmt.'
          ) > "$log" 2>&1
          rc=$?
          set -e
          cat "$log"
          exit "$rc"

      - name: Upload overlay idempotence diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: overlay-idempotence-failure
          path: |
            overlay-idempotence.log
            overlay-idempotence.diff
          if-no-files-found: ignore
          retention-days: 7

      - name: Build frontend from pristine upstream + overlay
        shell: bash
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

      - name: Test local proxy gateway auth from pristine upstream + overlay
        run: cargo test -p codex-app-transfer-proxy --lib -- --nocapture

      - name: Test config integration from pristine upstream + overlay
        run: cargo test -p codex-app-transfer-codex-integration --lib -- --nocapture

      - name: Test all adapter regressions from pristine upstream + overlay
        run: cargo test -p codex-app-transfer-adapters --lib -- --nocapture
